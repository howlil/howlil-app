name: Task 7 About filter correction once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/task7-about-filter-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Replace fuzzy skill matching
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/pages/about.astro')
          source = path.read_text()

          old_import = 'import { getCollection } from "astro:content";\n'
          new_import = old_import + 'import { matchesTag } from "../lib/filters";\n'
          if old_import not in source:
              raise SystemExit('About import insertion point not found')
          source = source.replace(old_import, new_import, 1)

          start = source.index('function normalizeTag(s: string) {')
          end = source.index('\n\nconst workExperiences', start)
          replacement = (
              'function countProjectsForSkill(skill: string) {\n'
              '  return projects.filter((project) =>\n'
              '    project.data.tags.some((tag) => matchesTag(tag, skill))\n'
              '  ).length;\n'
              '}\n'
          )
          source = source[:start] + replacement + source[end:]
          path.write_text(source)
          PY

          git diff --check
          git add src/pages/about.astro
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: use exact skill matching on about page [skip ci]'
          git push
