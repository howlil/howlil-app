name: Task 4 SEO correction once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/task4-seo-correction-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Apply Article metadata correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          article = Path('src/layouts/ArticleLayout.astro')
          source = article.read_text()

          replacements = [
              (
                  'import Chip from "../components/ui/Chip.astro";\n',
                  'import Chip from "../components/ui/Chip.astro";\nimport { SITE } from "../config/site";\nimport { withBase } from "../lib/paths";\n',
              ),
              (
                  '  description?: string;\n  articleTitle: string;\n',
                  '  description?: string;\n  image?: string;\n  articleTitle: string;\n',
              ),
              (
                  '  description,\n  articleTitle,\n',
                  '  description,\n  image = \'/og-image.svg\',\n  articleTitle,\n',
              ),
              (
                  "const siteUrl = Astro.site?.href || 'https://howlil.com';\nconst currentUrl = new URL(Astro.url.pathname, siteUrl).href;\nconst ogImage = '/og-image.png';\n",
                  "const siteUrl = Astro.site?.href || SITE.url;\nconst currentUrl = new URL(Astro.url.pathname, siteUrl).href;\nconst imageUrl = new URL(withBase(image), siteUrl).href;\n",
              ),
              (
                  '<BaseLayout title={title} description={description}>',
                  '<BaseLayout title={title} description={description} image={image}>',
              ),
              (
                  '      "name": "Mhd Ulil Abshar"\n    },\n    "image": ogImage,\n    "description": description\n',
                  '      "name": SITE.name\n    },\n    "image": imageUrl,\n    "mainEntityOfPage": currentUrl,\n    ...(description ? { "description": description } : {})\n',
              ),
          ]

          for old, new in replacements:
              if old not in source:
                  raise SystemExit(f'ArticleLayout expected pattern not found: {old[:80]!r}')
              source = source.replace(old, new, 1)
          article.write_text(source)

          blog = Path('src/pages/blog/[slug].astro')
          source = blog.read_text()
          old = '  description={post.data.excerpt}\n  articleTitle={post.data.title}\n'
          new = '  description={post.data.excerpt}\n  image={post.data.coverImage}\n  articleTitle={post.data.title}\n'
          if old not in source:
              raise SystemExit('Blog metadata insertion point not found')
          blog.write_text(source.replace(old, new, 1))

          project = Path('src/pages/projects/[slug].astro')
          source = project.read_text()
          old = '  description={project.data.excerpt}\n  articleTitle={project.data.title}\n'
          new = '  description={project.data.excerpt}\n  image={project.data.coverImages?.[0]}\n  articleTitle={project.data.title}\n'
          if old not in source:
              raise SystemExit('Project metadata insertion point not found')
          project.write_text(source.replace(old, new, 1))
          PY

          git diff --check
          git add src/layouts/ArticleLayout.astro src/pages/blog/'[slug].astro' src/pages/projects/'[slug].astro'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: complete article SEO metadata [skip ci]'
          git push
