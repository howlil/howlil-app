name: Optimize profile once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/optimize-profile-once.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Install ImageMagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends imagemagick

      - name: Convert profile to optimized WebP
        shell: bash
        run: |
          set -euo pipefail
          convert public/profile.jpg \
            -auto-orient \
            -resize '512x512^' \
            -gravity center \
            -extent 512x512 \
            -strip \
            -quality 82 \
            public/profile.webp

          test -s public/profile.webp
          size=$(stat -c%s public/profile.webp)
          echo "Optimized profile size: ${size} bytes"
          test "$size" -lt 200000

      - name: Update source and commit optimized asset
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/pages/index.astro')
          source = path.read_text()
          old = 'src={withBase("/profile.jpg")}\n          alt={SITE.name}'
          new = 'src={withBase("/profile.webp")}\n          alt={SITE.name}\n          width="96"\n          height="96"\n          decoding="async"\n          fetchpriority="high"'
          if old not in source:
              raise SystemExit('Expected profile markup was not found')
          path.write_text(source.replace(old, new, 1))
          PY

          git rm public/profile.jpg
          git add public/profile.webp src/pages/index.astro
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf: optimize profile image [skip ci]'
          git push
